[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-mcp"
version = "0.1.0"
description = "MCP server for DisruptionAI audit trail read/write"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.26.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.14.2",
    "boto3==1.42.73",
]

[project.scripts]
audit-mcp-server = "audit_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
